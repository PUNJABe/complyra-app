services:
  decoy:
    build: .
    ports:
      - "127.0.0.1:8089:8080"
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 96m
    pids_limit: 32
    networks: [decoy-only]
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
networks:
  decoy-only:
    internal: true
